<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FC 안양 댓글 추첨</title>
<meta name="description" content="에펨코리아 글의 댓글 작성자 중에서 당첨자를 추첨합니다.">
<link rel="icon" type="image/png" href="emblem.png">
<link rel="apple-touch-icon" href="emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #260046;
    --panel: #1e1526;
    --panel-line: #3b2c49;
    --gold: #ffe600;
    --gold-deep: #f6b008;
    --ink: #2a1900;
    --text: #ece6f2;
    --muted: #a99bb8;
    --field: #131115;
    --field-line: #cdb72c;
    --purple: #4a0a8c;
    --purple-line: #8a5ccc;
    --link: #cdb8ec;
    --danger: #ff8a8a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
    padding: 28px 16px 48px;
  }
  .panel {
    max-width: 636px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 14px;
    padding: 32px 28px 32px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
  }
  .emblem {
    display: block; width: 88px; height: 88px; margin: 0 auto 14px;
    filter: drop-shadow(0 0 12px rgba(255, 214, 0, .35));
  }
  h1 {
    margin: 0;
    text-align: center;
    color: var(--gold);
    font-size: 30px;
    font-weight: 900;
    letter-spacing: -.5px;
    text-shadow: 0 0 14px rgba(255, 214, 0, .55);
  }
  .sub { margin: 8px 0 0; text-align: center; font-size: 13px; color: #d9d2e0; word-break: keep-all; }

  /* 설정 */
  .settings { margin: 14px auto 0; font-size: 12.5px; }
  .settings > summary {
    list-style: none; display: flex; justify-content: center; align-items: center; gap: 8px;
    cursor: pointer; color: var(--muted);
  }
  .settings > summary::-webkit-details-marker { display: none; }
  .post-chip { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #d9d2e0; }
  .edit { flex: none; color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
  .settings form {
    margin-top: 12px; display: grid; gap: 12px; text-align: left;
    background: #16101c; border: 1px solid var(--panel-line); border-radius: 10px; padding: 14px;
  }
  .field { display: grid; gap: 4px; }
  .field > span { font-size: 12.5px; font-weight: 500; color: #e6e0ec; }
  .field input {
    width: 100%; background: var(--field); color: #e9e3d3; border: 1px solid var(--purple-line); border-radius: 6px;
    padding: 8px 10px; font-family: inherit; font-size: 13px;
  }
  .field input:focus { outline: none; border-color: var(--gold); }
  .field small { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .form-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .form-error { font-size: 12px; color: var(--danger); }

  .count { margin: 20px 0 10px; text-align: center; color: var(--gold); font-weight: 700; font-size: 15px; }

  textarea {
    display: block;
    width: 100%;
    background: var(--field);
    color: #e9e3d3;
    border: 2px solid var(--field-line);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 12.5px;
    line-height: 1.6;
    resize: vertical;
  }
  textarea:focus { outline: none; box-shadow: 0 0 0 3px rgba(255, 230, 0, .18); }
  #names { height: 96px; }

  .status {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 10px;
    margin-top: 8px; font-size: 12px; color: var(--muted); text-align: center;
  }
  .status.error { color: var(--danger); }
  .linkish {
    background: none; border: 0; padding: 0; font: inherit; color: var(--link);
    text-decoration: underline; text-underline-offset: 2px; cursor: pointer;
  }
  .linkish:disabled { opacity: .5; cursor: default; }

  .controls { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 22px; flex-wrap: wrap; }
  .controls label { font-size: 14px; color: #e6e0ec; }
  select {
    background: var(--purple); color: #fff; border: 1px solid var(--purple-line); border-radius: 5px;
    padding: 5px 8px; font-family: inherit; font-size: 14px; margin-left: 4px;
  }
  .draw {
    min-width: 108px; height: 40px; padding: 0 26px; border: 0; border-radius: 999px;
    background: linear-gradient(180deg, #fff06a, #fbd90f);
    color: #222; font-family: inherit; font-size: 16px; font-weight: 900; cursor: pointer;
    box-shadow: 0 0 18px rgba(255, 220, 0, .45);
    transition: transform .15s, box-shadow .15s;
  }
  .draw:hover:not(:disabled) { transform: translateY(-1px) scale(1.03); box-shadow: 0 0 26px rgba(255, 220, 0, .6); }
  .draw:disabled { opacity: .6; cursor: default; }

  .results { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 24px; }
  .results:empty { display: none; }
  .win {
    flex: 0 0 136px; min-height: 70px; padding: 10px 8px 9px; border-radius: 6px; text-align: center;
    background: linear-gradient(135deg, #ffe20a, var(--gold-deep));
    color: var(--ink); box-shadow: 0 6px 14px rgba(0, 0, 0, .35);
    display: flex; flex-direction: column; justify-content: center; gap: 3px;
    animation: pop .55s cubic-bezier(.2, .9, .3, 1.25) both;
  }
  .win .rank { font-size: 10.5px; font-weight: 700; color: #6b4c00; }
  .win .nm { font-size: 15px; font-weight: 900; word-break: break-all; }
  .win .pos { font-size: 10.5px; font-weight: 500; color: #7a5500; }
  @keyframes pop {
    from { opacity: .25; transform: scale(.55); filter: brightness(.45); }
    to { opacity: 1; transform: scale(1); filter: none; }
  }
  .drawn-at { margin-top: 14px; text-align: center; font-size: 12px; color: var(--muted); }
  .drawn-at:empty { display: none; }

  .more { margin-top: 18px; font-size: 13px; color: #d9d2e0; }
  .more + .more { margin-top: 8px; }
  .more > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .excluded { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }
  .excluded li { background: #16101c; border-radius: 6px; padding: 6px 10px; font-size: 12px; color: #bfb3cc; }
  .excluded b { color: #efe8f6; margin-right: 6px; }
  .note { margin: 8px 0; font-size: 12px; color: var(--muted); line-height: 1.6; }
  #raw { height: 140px; border-color: var(--purple-line); }
  .secondary {
    margin-top: 8px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--purple-line);
    background: var(--purple); color: #fff; font-family: inherit; font-size: 13px; cursor: pointer;
  }
  .form-actions .secondary { margin-top: 0; }
  .secondary:disabled { opacity: .6; cursor: default; }

  .rec-row {
    display: flex; align-items: center; justify-content: center; gap: 4px 10px; flex-wrap: wrap;
    margin-top: 12px; text-align: center;
  }
  .rec-row[hidden] { display: none; }
  .rec-row .secondary { margin-top: 0; }
  .rec-hint { font-size: 12px; color: var(--muted); }
  /* 녹화 영상에는 녹화 버튼과 펼친 패널이 나오지 않게 한다 */
  body.recording .rec-row { visibility: hidden; }
  .rec-result { margin-top: 16px; display: grid; gap: 8px; justify-items: center; }
  .rec-result[hidden] { display: none; }
  .rec-result video {
    width: 100%; max-width: 420px; border-radius: 8px; background: #000; border: 1px solid var(--panel-line);
  }
  .rec-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .rec-actions .secondary { margin-top: 0; display: inline-block; text-decoration: none; }

  @media (max-width: 520px) {
    body { padding: 16px 12px 36px; }
    .panel { padding: 24px 16px 24px; }
    .emblem { width: 68px; height: 68px; margin-bottom: 10px; }
    h1 { font-size: 23px; }
    .win { flex-basis: calc(50% - 5px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .win { animation: none; }
  }
</style>
</head>
<body>
  <main class="panel">
    <img class="emblem" src="emblem.png" alt="FC 안양 엠블럼">
    <h1>FC 안양 팬 댓글 당첨자 추첨</h1>
    <p class="sub" id="sub"></p>

    <details class="settings" id="settings">
      <summary><span class="post-chip" id="postChip">게시글 불러오는 중…</span><span class="edit">설정 변경</span></summary>
      <form id="settingsForm" novalidate>
        <label class="field">
          <span>게시글 주소</span>
          <input id="postInput" type="url" inputmode="url" autocomplete="off" placeholder="https://www.fmkorea.com/10351544409">
          <small>에펨코리아 글 주소를 붙여넣으세요 (모바일 주소도 됩니다).</small>
        </label>
        <label class="field">
          <span>필터 문구</span>
          <input id="kwInput" type="text" autocomplete="off" placeholder="비워 두면 모든 댓글 작성자가 참여">
          <small>이 문구가 들어간 댓글을 단 사람만 참여합니다. 쉼표로 여러 개 입력 가능.
            띄어쓰기·반복 글자는 무시해요 (안양 만세, 안양만만세 → 인정).</small>
        </label>
        <label class="field">
          <span>제외할 닉네임</span>
          <input id="exInput" type="text" autocomplete="off" placeholder="쉼표로 구분">
          <small>글 작성자는 자동으로 제외됩니다.</small>
        </label>
        <div class="form-actions">
          <button class="secondary" id="apply" type="submit">적용하고 댓글 불러오기</button>
          <span class="form-error" id="formError" role="alert"></span>
        </div>
      </form>
    </details>

    <div class="count">현재 참여 인원 <span id="count">0</span>명</div>
    <textarea id="names" spellcheck="false" aria-label="참여자 명단 (쉼표로 구분)" placeholder="댓글을 불러오는 중…"></textarea>
    <div class="status" id="status">
      <span id="statusText">에펨코리아 댓글을 불러오는 중…</span>
      <button class="linkish" id="reload" type="button">새로고침</button>
      <a class="linkish" id="postLink" target="_blank" rel="noopener">원문 보기</a>
    </div>

    <div class="controls">
      <label>당첨 인원 선택
        <select id="size">
          <option value="1">1명</option><option value="2">2명</option><option value="3" selected>3명</option>
          <option value="4">4명</option><option value="5">5명</option><option value="6">6명</option>
          <option value="7">7명</option><option value="8">8명</option><option value="9">9명</option>
          <option value="10">10명</option>
        </select>
      </label>
      <button class="draw" id="draw" type="button">추첨</button>
    </div>
    <div class="rec-row" id="recRow" hidden>
      <button class="secondary" id="recDraw" type="button">녹화하며 추첨</button>
      <span class="rec-hint" id="recHint">추첨 장면을 영상 파일로 저장해요 (에펨코리아 업로드용)</span>
    </div>

    <div class="results" id="results" aria-live="polite"></div>
    <div class="drawn-at" id="drawnAt"></div>

    <div class="rec-result" id="recResult" hidden>
      <video id="recVideo" controls playsinline muted loop></video>
      <div class="rec-actions">
        <a class="secondary" id="recSave" href="#" download>영상 저장</a>
        <button class="secondary" id="recShare" type="button" hidden>공유 · 사진에 저장</button>
      </div>
    </div>

    <details class="more" id="excludedBox" hidden>
      <summary>필터 문구가 없어 제외된 댓글 작성자 <span id="excludedCount"></span></summary>
      <ul class="excluded" id="excluded"></ul>
    </details>

    <details class="more" id="pasteBox">
      <summary>댓글 직접 붙여넣기 (자동 불러오기가 안 될 때)</summary>
      <p class="note">에펨코리아 글에서 댓글 영역을 전체 선택해 복사한 뒤 아래에 붙여넣고 <b>명단 만들기</b>를 누르세요.
        제외할 닉네임·중복은 빠지고, 필터 문구가 들어간 댓글을 단 사람만 명단에 들어갑니다.</p>
      <textarea id="raw" spellcheck="false" placeholder="온필드리뷰 6 분 전&#10;마감&#10;기이구 6 분 전&#10;안양만세&#10;…"></textarea>
      <button class="secondary" id="parseRaw" type="button">명단 만들기</button>
    </details>
  </main>

<script>
  const DEFAULTS = { post: '10351544409', kw: '안양만세', ex: '차짬' };
  const STORE_KEY = 'fm-coffee-settings';

  const $ = (sel) => document.querySelector(sel);
  const namesEl = $('#names');
  const drawBtn = $('#draw');
  const reloadBtn = $('#reload');
  const applyBtn = $('#apply');
  const resultsEl = $('#results');

  let settings = loadSettings();
  // 불러온 글의 작성자 ({ name, memberId })
  let author = null;
  // 이름 → 전체 댓글 중 몇 번째 댓글로 참여했는지
  let commentOrder = new Map();
  let loadSeq = 0;

  /* ---------- 설정 ---------- */

  // 주소창 값 > 이 브라우저에 저장된 값 > 기본값
  function loadSettings() {
    const query = new URLSearchParams(location.search);
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { /* 저장소를 못 쓰면 기본값 */ }
    const pick = (key) => query.get(key) ?? saved[key] ?? DEFAULTS[key];
    return { post: parsePostId(pick('post')) || DEFAULTS.post, kw: pick('kw'), ex: pick('ex') };
  }

  function saveSettings() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(settings)); } catch { /* 무시 */ }
    // 주소창에도 반영해서 이 링크를 그대로 공유·즐겨찾기 할 수 있게 한다
    history.replaceState(null, '', `${location.pathname}?${new URLSearchParams(settings)}`);
  }

  // "https://www.fmkorea.com/123", "https://m.fmkorea.com/best/123", "...document_srl=123", "123" 모두 허용
  function parsePostId(input) {
    const s = String(input ?? '').trim();
    const m = s.match(/document_srl=(\d+)/) || s.match(/(?:^|\/)(\d{5,})(?=[/?#]|$)/);
    return m ? m[1] : null;
  }

  const postUrl = () => `https://www.fmkorea.com/${settings.post}`;
  const splitList = (text) => text.split(',').map((s) => s.trim()).filter(Boolean);
  // 띄어쓰기와 연달아 반복된 글자를 무시한다: "안양 만세", "안양만만세" → "안양만세"
  const normalize = (s) => s.toLowerCase().replace(/\s+/g, '').replace(/(.)\1+/gu, '$1');

  function keywordMatcher() {
    const keywords = splitList(settings.kw).map(normalize).filter(Boolean);
    if (!keywords.length) return () => true;
    return (text) => {
      const t = normalize(text);
      return keywords.some((k) => t.includes(k));
    };
  }

  function renderSettings() {
    $('#postInput').value = postUrl();
    $('#kwInput').value = settings.kw;
    $('#exInput').value = settings.ex;
    $('#postLink').href = postUrl();
    const keywords = splitList(settings.kw);
    $('#sub').textContent = keywords.length
      ? `${keywords.map((k) => `'${k}'`).join(', ')} 댓글 중 영광의 당첨자를 선정합니다`
      : '모든 댓글 중 영광의 당첨자를 선정합니다';
  }

  $('#settingsForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const post = parsePostId($('#postInput').value);
    if (!post) {
      $('#formError').textContent = '게시글 주소를 확인해 주세요. 예) https://www.fmkorea.com/10351544409';
      return;
    }
    $('#formError').textContent = '';
    settings = { post, kw: $('#kwInput').value.trim(), ex: $('#exInput').value.trim() };
    saveSettings();
    renderSettings();
    resultsEl.replaceChildren();
    $('#drawnAt').textContent = '';
    $('#settings').open = false;
    loadFromSite();
  });

  /* ---------- 명단 ---------- */

  function parseNames(text) {
    const parts = text.includes('\n') ? text.split('\n') : text.split(',');
    return [...new Set(parts.map((s) => s.trim()).filter(Boolean))];
  }

  function setNames(list) {
    // 닉네임에 쉼표가 있으면 줄바꿈으로 구분한다
    namesEl.value = list.some((n) => n.includes(',')) ? list.join('\n') : list.join(', ');
    updateCount();
  }

  function updateCount() {
    $('#count').textContent = parseNames(namesEl.value).length;
  }

  function setStatus(text, isError = false) {
    $('#statusText').textContent = text;
    $('#status').classList.toggle('error', isError);
  }

  function excludedNote() {
    const names = new Set(splitList(settings.ex));
    if (author?.name) names.add(author.name);
    return names.size ? `${[...names].join(', ')}·중복 제외` : '중복 제외';
  }

  // 작성자·제외 닉네임은 빼고, 같은 사람은 한 번만, 댓글 중 하나라도 필터 문구가 있으면 참여
  function selectParticipants(comments) {
    const matches = keywordMatcher();
    const skip = new Set(splitList(settings.ex));
    if (author?.name) skip.add(author.name);
    const sorted = [...comments].sort((a, b) => a.order - b.order);
    const people = new Map();
    sorted.forEach((c, i) => {
      if (!c.name || c.isAuthor || skip.has(c.name)) return;
      if (author?.memberId && c.memberId === author.memberId) return;
      const key = c.memberId || c.name;
      const person = people.get(key) || { name: c.name, texts: [], hitAt: 0 };
      person.texts.push(c.text);
      if (!person.hitAt && matches(c.text)) person.hitAt = i + 1;
      people.set(key, person);
    });
    const everyone = [...people.values()];
    return {
      joined: everyone.filter((p) => p.hitAt).sort((a, b) => a.hitAt - b.hitAt),
      excluded: everyone.filter((p) => !p.hitAt),
    };
  }

  function applyComments(comments) {
    const { joined, excluded } = selectParticipants(comments);
    commentOrder = new Map(joined.map((p) => [p.name, p.hitAt]));
    setNames(joined.map((p) => p.name));

    $('#excluded').replaceChildren(...excluded.map((p) => {
      const li = document.createElement('li');
      const b = document.createElement('b');
      b.textContent = p.name;
      li.append(b, p.texts.join(' / '));
      return li;
    }));
    $('#excludedCount').textContent = `${excluded.length}명`;
    $('#excludedBox').hidden = excluded.length === 0;
  }

  /* ---------- 에펨코리아에서 불러오기 ---------- */

  function readComment(li) {
    const plate = li.querySelector('.meta .member_plate') || li.querySelector('.meta a');
    const body = li.querySelector('.xe_content')?.cloneNode(true);
    body?.querySelectorAll('a.findParent').forEach((a) => a.remove()); // 답글 앞에 붙는 상대 닉네임
    return {
      order: Number(li.id.replace('comment_', '')),
      memberId: plate?.className.match(/member_(\d+)/)?.[1] || null,
      name: plate?.textContent.trim() || '',
      text: body?.textContent.trim() || '',
      isAuthor: !!li.querySelector('.comment-content.document_writer'),
    };
  }

  async function fetchPost(postId) {
    const byId = new Map();
    let title = '';
    let writer = null;
    // 댓글 페이지를 차례로 읽다가 새 댓글이 없는 페이지가 나오면 멈춘다
    for (let page = 1; page <= 30; page++) {
      const url = `https://www.fmkorea.com/index.php?document_srl=${postId}&cpage=${page}`;
      const res = await fetch(url, { credentials: 'omit', cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
      if (page === 1) {
        const head = doc.querySelector('.rd_hd');
        if (!head || !doc.querySelector('.rd_body')) throw new Error('글을 찾지 못했어요. 주소를 확인해 주세요');
        title = head.querySelector('h1')?.textContent.trim() || doc.title;
        const plate = head.querySelector('.member_plate');
        writer = plate && {
          name: plate.textContent.trim(),
          memberId: plate.className.match(/member_(\d+)/)?.[1] || null,
        };
      }
      let added = 0;
      for (const li of doc.querySelectorAll('li.fdb_itm[id^="comment_"]')) {
        if (byId.has(li.id)) continue;
        byId.set(li.id, readComment(li));
        added++;
      }
      if (!added) break;
    }
    return { title, writer, comments: [...byId.values()] };
  }

  async function loadFromSite() {
    const seq = ++loadSeq;
    reloadBtn.disabled = true;
    author = null;
    setStatus('에펨코리아 댓글을 불러오는 중…');
    try {
      const { title, writer, comments } = await fetchPost(settings.post);
      if (seq !== loadSeq) return; // 그사이 다른 글을 불러오기 시작함
      author = writer;
      $('#postChip').textContent = title;
      $('#postChip').title = title;
      applyComments(comments);
      const time = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      setStatus(`댓글 ${comments.length}개 확인 · ${time} 기준 · ${excludedNote()}`);
    } catch (err) {
      if (seq !== loadSeq) return;
      $('#postChip').textContent = '게시글을 불러오지 못했어요';
      setStatus(`댓글을 자동으로 불러오지 못했어요 (${err.message}). 아래에서 직접 붙여넣어 주세요.`, true);
      $('#pasteBox').open = true;
      updateCount();
    } finally {
      if (seq === loadSeq) reloadBtn.disabled = false;
    }
  }

  /* ---------- 직접 붙여넣기 ---------- */

  // "닉네임 6 분 전" / "* [닉네임](링크) 6 분 전" / "닉네임 2026.09.19 12:38" 형태의 줄을 댓글 시작으로 본다
  const HEAD = /^(?:[*•-]\s*)?(.+?)\s+(\d+\s*(?:초|분|시간|일)\s*전|\d{2,4}[.-]\d{1,2}[.-]\d{1,2}(?:\s+\d{1,2}:\d{2}(?::\d{2})?)?)$/;
  // 추천 수·수정·삭제·댓글 버튼 같은 줄
  const NOISE = /^(?:\d+\s*)?(?:수정\s*)?(?:삭제\s*)?(?:댓글|신고)?$|^댓글\s*\d+\s*개$/;
  const MD_LINK = /\[([^\]]*)\]\([^)]*\)/g;

  function parsePasted(raw) {
    const comments = [];
    let current = null;
    for (const rawLine of raw.split(/\r?\n/)) {
      const line = rawLine.trim();
      const plain = line.replace(MD_LINK, '$1');
      if (!plain) continue;
      const head = plain.match(HEAD);
      if (head) {
        current = { name: head[1].trim(), text: '', order: comments.length, memberId: null, isAuthor: false };
        comments.push(current);
        continue;
      }
      if (!current || NOISE.test(plain)) continue;
      const body = line.replace(/^\[[^\]]*\]\([^)]*#comment_\d+\)\s*/, '').replace(MD_LINK, '$1');
      current.text += (current.text ? ' ' : '') + body;
    }
    return comments;
  }

  $('#parseRaw').addEventListener('click', () => {
    const comments = parsePasted($('#raw').value);
    if (!comments.length) {
      setStatus('붙여넣은 내용에서 댓글을 찾지 못했어요.', true);
      return;
    }
    applyComments(comments);
    setStatus(`붙여넣은 댓글 ${comments.length}개로 명단을 만들었어요 · ${excludedNote()}`);
  });

  /* ---------- 추첨 ---------- */

  // 0 이상 n 미만의 치우침 없는 난수
  function randomInt(n) {
    const limit = Math.floor(0x100000000 / n) * n;
    const buf = new Uint32Array(1);
    do crypto.getRandomValues(buf); while (buf[0] >= limit);
    return buf[0] % n;
  }

  function pick(list, k) {
    const a = [...list];
    for (let i = 0; i < k; i++) {
      const j = i + randomInt(a.length - i);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a.slice(0, k);
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // 추첨 연출 타이밍 (화면과 영상이 같은 값을 쓴다)
  const LEAD_MS = 1200; // 녹화 시작 후 첫 카드까지
  const STEP_MS = 450; // 카드 사이 간격
  const POP_MS = 550; // 카드 등장 애니메이션 길이 (CSS .win 과 같게)
  const HOLD_MS = 2500; // 마지막 결과를 보여 주는 시간

  // 당첨자는 여기서 한 번만 뽑고, 화면과 영상 모두 이 결과를 그대로 보여 준다
  function makeDraw() {
    const names = parseNames(namesEl.value);
    const k = Math.min(Number($('#size').value), names.length);
    const winners = pick(names.map((name, i) => ({ name, listPos: i + 1 })), k).map((w, i) => {
      const at = commentOrder.get(w.name);
      return {
        rank: `추첨 ${i + 1}위`,
        name: w.name,
        pos: at ? `전체 댓글 중 ${at}번째` : `참여 명단 ${w.listPos}번째`,
      };
    });
    const when = new Date().toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'medium' });
    return { names, winners, stamp: `${when} 추첨 · 참여 ${names.length}명 중 ${k}명` };
  }

  function winnerCard(w) {
    const card = document.createElement('div');
    card.className = 'win';
    for (const [cls, tag, text] of [['rank', 'span', w.rank], ['nm', 'strong', w.name], ['pos', 'span', w.pos]]) {
      const el = document.createElement(tag);
      el.className = cls;
      el.textContent = text;
      card.append(el);
    }
    return card;
  }

  async function showDraw(draw) {
    resultsEl.replaceChildren();
    $('#drawnAt').textContent = '';
    for (const w of draw.winners) {
      const card = winnerCard(w);
      resultsEl.append(card);
      card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      await sleep(STEP_MS);
    }
    $('#drawnAt').textContent = draw.stamp;
  }

  const recBtn = $('#recDraw');
  const busyButtons = [drawBtn, reloadBtn, applyBtn, recBtn];
  const setBusy = (busy) => busyButtons.forEach((b) => { b.disabled = busy; });

  function hasParticipants() {
    if (parseNames(namesEl.value).length) return true;
    setStatus('참여자가 없어요. 명단을 먼저 채워 주세요.', true);
    return false;
  }

  drawBtn.addEventListener('click', async () => {
    if (!hasParticipants()) return;
    setBusy(true);
    $('#recResult').hidden = true;
    await showDraw(makeDraw());
    setBusy(false);
  });

  /* ---------- 녹화하며 추첨 ----------
     PC 크롬: 지금 탭을 그대로 녹화한다.
     폰처럼 화면 녹화가 안 되는 브라우저: 같은 추첨 결과를 캔버스에 그려 영상으로 만든다. */

  const canCaptureCanvas = typeof HTMLCanvasElement.prototype.captureStream === 'function';
  $('#recRow').hidden = typeof MediaRecorder === 'undefined'
    || !(navigator.mediaDevices?.getDisplayMedia || canCaptureCanvas);

  const setRecHint = (text) => { $('#recHint').textContent = text; };
  const sizeLabel = (blob) => (blob.size < 1048576
    ? `${Math.ceil(blob.size / 1024)}KB`
    : `${(blob.size / 1048576).toFixed(1)}MB`);

  function recorderType() {
    return ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm']
      .find((t) => MediaRecorder.isTypeSupported(t)) || '';
  }

  function fileName(ext) {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return `추첨_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${ext}`;
  }

  function saveFile(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60_000);
  }

  // stream 을 녹화하는 동안 run() 을 실행하고, 끝나면 영상 파일(mp4, 안 되면 webm)을 돌려준다
  async function record(stream, run) {
    const type = recorderType();
    const recorder = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 6_000_000 });
    const chunks = [];
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    const stopped = new Promise((resolve) => { recorder.onstop = resolve; });
    const stop = () => { if (recorder.state !== 'inactive') recorder.stop(); };
    stream.getVideoTracks()[0].addEventListener('ended', stop); // 크롬의 "공유 중지"를 누른 경우

    recorder.start();
    try {
      await run();
    } finally {
      stop();
      await stopped;
      stream.getTracks().forEach((t) => t.stop());
    }
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    return { blob: new Blob(chunks, { type: type.split(';')[0] || 'video/webm' }), name: fileName(ext) };
  }

  recBtn.addEventListener('click', () => {
    if (!hasParticipants()) return;
    $('#recResult').hidden = true;
    if (navigator.mediaDevices?.getDisplayMedia) recordTab();
    else recordCanvas();
  });

  async function recordTab() {
    let stream;
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: 30 },
        audio: false,
        preferCurrentTab: true,
        selfBrowserSurface: 'include',
        surfaceSwitching: 'exclude',
      });
    } catch (err) {
      if (err.name === 'NotAllowedError') {
        setRecHint('녹화가 취소됐어요. 창에서 "허용"(이 탭 공유)을 눌러야 녹화돼요.');
        return;
      }
      recordCanvas(); // 화면 녹화를 지원하지 않는 환경
      return;
    }

    setBusy(true);
    document.body.classList.add('recording');
    document.querySelectorAll('details[open]').forEach((d) => { d.open = false; });
    window.scrollTo(0, 0);
    try {
      const { blob, name } = await record(stream, async () => {
        await sleep(LEAD_MS);
        await showDraw(makeDraw());
        await sleep(HOLD_MS);
      });
      saveFile(blob, name);
      setRecHint(`저장했어요: ${name} (${sizeLabel(blob)}) · 다운로드 폴더를 확인하세요`);
    } catch (err) {
      setRecHint(`녹화에 실패했어요 (${err.message})`);
    } finally {
      document.body.classList.remove('recording');
      setBusy(false);
    }
  }

  async function recordCanvas() {
    if (!canCaptureCanvas) {
      setRecHint('이 브라우저에서는 영상 저장을 지원하지 않아요. 휴대폰의 화면 녹화를 이용해 주세요.');
      return;
    }
    setBusy(true);
    setRecHint('추첨 영상을 만드는 중…');
    try {
      const draw = makeDraw();
      const video = await buildDrawVideo(draw);
      const { blob, name } = await record(video.canvas.captureStream(30), async () => {
        const start = performance.now();
        const onScreen = sleep(LEAD_MS).then(() => showDraw(draw));
        // requestAnimationFrame 은 화면이 가려지면 멈추므로 타이머로 30fps 를 그린다
        await new Promise((resolve) => {
          const frame = () => {
            const t = performance.now() - start;
            video.paint(t);
            if (t >= video.duration) resolve();
            else setTimeout(frame, 1000 / 30);
          };
          frame();
        });
        await onScreen;
      });
      showRecording(blob, name);
    } catch (err) {
      setRecHint(`영상을 만들지 못했어요 (${err.message})`);
    } finally {
      setBusy(false);
    }
  }

  let recordingUrl = null;

  // 폰에서는 바로 다운로드하는 대신 미리보기와 저장·공유 버튼을 보여 준다
  function showRecording(blob, name) {
    if (recordingUrl) URL.revokeObjectURL(recordingUrl);
    recordingUrl = URL.createObjectURL(blob);
    $('#recVideo').src = recordingUrl;
    const save = $('#recSave');
    save.href = recordingUrl;
    save.download = name;

    const file = new File([blob], name, { type: blob.type });
    const share = $('#recShare');
    share.hidden = !navigator.canShare?.({ files: [file] });
    share.onclick = () => navigator.share({ files: [file] }).catch(() => { /* 공유 창을 닫음 */ });

    $('#recResult').hidden = false;
    $('#recResult').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    setRecHint(`추첨 영상이 만들어졌어요 (${sizeLabel(blob)}). 아래에서 저장하거나 공유하세요.`);
  }

  /* ---------- 캔버스로 추첨 영상 그리기 (폰용) ---------- */

  const FONT_STACK = '"Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
  const font = (weight, size) => `${weight} ${size}px ${FONT_STACK}`;

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  // 글자가 maxW 안에 들어갈 때까지 글꼴 크기를 줄인다
  function fitFont(c, weight, size, text, maxW) {
    let s = size;
    c.font = font(weight, s);
    while (s > 8 && c.measureText(text).width > maxW) {
      s -= 0.5;
      c.font = font(weight, s);
    }
  }

  function ellipsize(c, text, maxW) {
    if (c.measureText(text).width <= maxW) return text;
    let s = text;
    while (s && c.measureText(`${s}…`).width > maxW) s = s.slice(0, -1);
    return `${s}…`;
  }

  // 명단을 "닉네임, " 단위로 줄바꿈한다 (한 닉네임이 한 줄보다 길면 글자 단위로)
  function wrapNames(c, names, maxW) {
    const lines = [];
    let line = '';
    names.forEach((n, i) => {
      const token = i < names.length - 1 ? `${n}, ` : n;
      if (c.measureText(line + token).width <= maxW) {
        line += token;
        return;
      }
      if (line) lines.push(line.trimEnd());
      line = '';
      for (const ch of token) {
        if (line && c.measureText(line + ch).width > maxW) {
          lines.push(line);
          line = '';
        }
        line += ch;
      }
    });
    if (line) lines.push(line.trimEnd());
    return lines;
  }

  // CSS 의 cubic-bezier(.2, .9, .3, 1.25) 처럼 살짝 튀어나왔다 돌아오는 움직임
  const easeOutBack = (x) => 1 + 2.7 * (x - 1) ** 3 + 1.7 * (x - 1) ** 2;

  async function buildDrawVideo(draw) {
    const W = 540; // 논리 폭. 실제 영상은 S배 (1080px)
    const S = 2;
    const M = 16;
    const PAD = 24;
    const innerX = M + PAD;
    const innerW = W - (M + PAD) * 2;

    const title = $('h1').textContent;
    const sub = $('#sub').textContent;
    const post = $('#postChip').textContent;
    const count = `현재 참여 인원 ${draw.names.length}명`;
    const sizeText = $('#size').selectedOptions[0].textContent;

    // 한글 웹폰트는 글자 범위별 조각으로 나뉘어 있어서, 영상에 쓸 글자가 든 조각을 미리 불러 둔다
    const allText = [title, sub, post, count, sizeText, '당첨 인원 선택 추첨', draw.stamp, ...draw.names,
      ...draw.winners.flatMap((w) => [w.rank, w.name, w.pos])].join('');
    await Promise.race([
      Promise.all([400, 500, 700, 900].map((w) => document.fonts.load(font(w, 16), allText))).catch(() => {}),
      sleep(3000),
    ]);

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    // 세로 배치 계산 (논리 좌표)
    ctx.font = font(400, 12.5);
    let nameLines = wrapNames(ctx, draw.names, innerW - 24);
    const MAX_LINES = 6;
    if (nameLines.length > MAX_LINES) {
      nameLines = nameLines.slice(0, MAX_LINES);
      let last = nameLines[MAX_LINES - 1];
      while (last && ctx.measureText(`${last} …`).width > innerW - 24) last = last.slice(0, -1);
      nameLines[MAX_LINES - 1] = `${last} …`;
    }

    let y = M + PAD;
    const emblemY = y; y += 76 + 12;
    const titleY = y; y += 40;
    const subY = y; y += 24;
    const postY = y; y += 30;
    const countY = y; y += 30;
    const boxY = y;
    const boxH = Math.max(3, nameLines.length) * 20 + 20;
    y += boxH + 22;
    const controlsY = y; y += 40 + 24;

    const k = draw.winners.length;
    const cols = k === 4 ? 2 : Math.min(3, k);
    const GAP = 10;
    const CW = (innerW - GAP * 2) / 3;
    const CH = 74;
    const cards = draw.winners.map((w, i) => {
      const row = Math.floor(i / cols);
      const inRow = Math.min(cols, k - row * cols);
      const rowW = inRow * CW + (inRow - 1) * GAP;
      return { ...w, x: W / 2 - rowW / 2 + (i % cols) * (CW + GAP), y: y + row * (CH + GAP), at: LEAD_MS + i * STEP_MS };
    });
    y += Math.ceil(k / cols) * (CH + GAP) - GAP + 14;
    const stampY = y; y += 16 + PAD;
    const panelH = y - M;
    const H = y + M;

    canvas.width = W * S;
    canvas.height = Math.ceil((H * S) / 2) * 2; // 영상 코덱은 짝수 크기를 좋아한다

    // 움직이지 않는 부분은 한 번만 그려 둔다
    const still = document.createElement('canvas');
    still.width = canvas.width;
    still.height = canvas.height;
    const b = still.getContext('2d');
    b.scale(S, S);
    b.fillStyle = '#260046';
    b.fillRect(0, 0, W, canvas.height / S);

    b.save();
    b.shadowColor = 'rgba(0, 0, 0, .35)';
    b.shadowBlur = 40 * S;
    b.shadowOffsetY = 12 * S;
    roundRect(b, M, M, W - M * 2, panelH, 14);
    b.fillStyle = '#1e1526';
    b.fill();
    b.restore();
    b.lineWidth = 1;
    b.strokeStyle = '#3b2c49';
    roundRect(b, M + 0.5, M + 0.5, W - M * 2 - 1, panelH - 1, 14);
    b.stroke();

    const emblem = $('.emblem');
    if (emblem.complete && emblem.naturalWidth) {
      b.save();
      b.shadowColor = 'rgba(255, 214, 0, .35)';
      b.shadowBlur = 12 * S;
      b.drawImage(emblem, W / 2 - 38, emblemY, 76, 76);
      b.restore();
    }

    b.textAlign = 'center';
    b.textBaseline = 'top';
    b.save();
    fitFont(b, 900, 26, title, innerW);
    b.fillStyle = '#ffe600';
    b.shadowColor = 'rgba(255, 214, 0, .55)';
    b.shadowBlur = 14 * S;
    b.fillText(title, W / 2, titleY);
    b.restore();

    fitFont(b, 400, 13, sub, innerW);
    b.fillStyle = '#d9d2e0';
    b.fillText(sub, W / 2, subY);

    b.font = font(400, 12);
    b.fillStyle = '#a99bb8';
    b.fillText(ellipsize(b, post, innerW), W / 2, postY);

    b.font = font(700, 15);
    b.fillStyle = '#ffe600';
    b.fillText(count, W / 2, countY);

    roundRect(b, innerX, boxY, innerW, boxH, 8);
    b.fillStyle = '#131115';
    b.fill();
    b.lineWidth = 2;
    b.strokeStyle = '#cdb72c';
    b.stroke();
    b.textAlign = 'left';
    b.font = font(400, 12.5);
    b.fillStyle = '#e9e3d3';
    nameLines.forEach((line, i) => b.fillText(line, innerX + 12, boxY + 12 + i * 20));

    // 당첨 인원 선택 [3명] (추첨)
    b.font = font(400, 14);
    const labelW = b.measureText('당첨 인원 선택').width;
    const selW = 64;
    const btnW = 108;
    let x = W / 2 - (labelW + 8 + selW + 14 + btnW) / 2;
    const midY = controlsY + 20;
    b.textBaseline = 'middle';
    b.fillStyle = '#e6e0ec';
    b.fillText('당첨 인원 선택', x, midY);
    x += labelW + 8;
    roundRect(b, x, midY - 15, selW, 30, 5);
    b.fillStyle = '#4a0a8c';
    b.fill();
    b.lineWidth = 1;
    b.strokeStyle = '#8a5ccc';
    b.stroke();
    b.fillStyle = '#fff';
    b.fillText(sizeText, x + 10, midY);
    b.beginPath(); // ▾
    b.moveTo(x + selW - 18, midY - 2);
    b.lineTo(x + selW - 14, midY + 2);
    b.lineTo(x + selW - 10, midY - 2);
    b.strokeStyle = '#fff';
    b.lineWidth = 1.5;
    b.stroke();
    x += selW + 14;
    b.save();
    const btnGrad = b.createLinearGradient(0, midY - 20, 0, midY + 20);
    btnGrad.addColorStop(0, '#fff06a');
    btnGrad.addColorStop(1, '#fbd90f');
    b.shadowColor = 'rgba(255, 220, 0, .45)';
    b.shadowBlur = 18 * S;
    roundRect(b, x, midY - 20, btnW, 40, 20);
    b.fillStyle = btnGrad;
    b.fill();
    b.restore();
    b.textAlign = 'center';
    b.font = font(900, 16);
    b.fillStyle = '#222';
    b.fillText('추첨', x + btnW / 2, midY + 1);

    function paintCard(card, p) {
      const scale = 0.55 + 0.45 * easeOutBack(p);
      ctx.save();
      ctx.globalAlpha = 0.25 + 0.75 * Math.min(1, p * 1.4);
      ctx.translate(card.x + CW / 2, card.y + CH / 2);
      ctx.scale(scale, scale);
      ctx.translate(-CW / 2, -CH / 2);

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, .35)';
      ctx.shadowBlur = 14 * S;
      ctx.shadowOffsetY = 6 * S;
      const grad = ctx.createLinearGradient(0, 0, CW, CH);
      grad.addColorStop(0, '#ffe20a');
      grad.addColorStop(1, '#f6b008');
      roundRect(ctx, 0, 0, CW, CH, 6);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.restore();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = font(700, 10.5);
      ctx.fillStyle = '#6b4c00';
      ctx.fillText(card.rank, CW / 2, 17);
      fitFont(ctx, 900, 15, card.name, CW - 12);
      ctx.fillStyle = '#2a1900';
      ctx.fillText(card.name, CW / 2, CH / 2 + 1);
      ctx.font = font(500, 10.5);
      ctx.fillStyle = '#7a5500';
      ctx.fillText(card.pos, CW / 2, CH - 16);

      // 처음엔 어두웠다가 밝아진다
      if (p < 1) {
        roundRect(ctx, 0, 0, CW, CH, 6);
        ctx.fillStyle = `rgba(0, 0, 0, ${0.55 * (1 - p)})`;
        ctx.fill();
      }
      ctx.restore();
    }

    const stampAt = LEAD_MS + k * STEP_MS;

    function paint(t) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(still, 0, 0);
      ctx.setTransform(S, 0, 0, S, 0, 0);
      for (const card of cards) {
        const p = (t - card.at) / POP_MS;
        if (p > 0) paintCard(card, Math.min(p, 1));
      }
      if (t >= stampAt) {
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        fitFont(ctx, 400, 12, draw.stamp, innerW);
        ctx.fillStyle = '#a99bb8';
        ctx.fillText(draw.stamp, W / 2, stampY);
      }
    }

    return { canvas, paint, duration: stampAt + HOLD_MS };
  }

  namesEl.addEventListener('input', updateCount);
  reloadBtn.addEventListener('click', loadFromSite);

  renderSettings();
  loadFromSite();
</script>
</body>
